site_name: Low-Ops Platform Documentation
theme:
  name: 'material'
  logo: assets/logo.png
  custom_dir: overrides
  palette:
    primary: 'blue'
    accent: 'blue gray'
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer
    - header.autohide
extra:
  homepage: https://low-ops.com/
plugins:
  - search
copyright: Copyright &copy; 2022 - 2024 <a href="https://cinaq.com">CINAQ.com</a>
extra_javascript:
  - "js/extra.js"
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format